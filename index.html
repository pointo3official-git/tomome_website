<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- Page title -->
    <title>Tomome — Pregnancy Care & Support</title>

    <!--
      Favicon:
      icon.png MUST live at /public/logos/icon.png in your project.
      Vite copies everything in /public as-is to the site root on build,
      so this reference has to match that exact file, exact case.
      The ?v=2 query string busts browser favicon caching — bump it
      whenever you change the image and it doesn't seem to update.
    -->
    <link rel="icon" type="image/png" href="/logos/icon.png?v=2" />
    <link rel="shortcut icon" href="/logos/icon.png?v=2" />
    <link rel="apple-touch-icon" href="/logos/icon.png?v=2" />

    <!-- Browser theme -->
    <meta name="theme-color" content="#ffffff" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- SEO -->
    <meta
      name="description"
      content="Tomome is an online pregnancy support platform providing pregnancy education, prenatal wellness, nutrition guidance, childbirth preparation, expert guidance, and ongoing support between routine antenatal visits."
    />

    <meta name="author" content="Tomome" />

    <meta
      property="og:title"
      content="Tomome — Pregnancy Care & Support"
    />

    <meta
      property="og:description"
      content="Pregnancy education, prenatal wellness, nutrition guidance, childbirth preparation, expert guidance, and ongoing support for expecting mothers."
    />

    <meta property="og:type" content="website" />

    <meta
      property="og:url"
      content="https://tomome-website.vercel.app/"
    />

    <meta
      property="og:image"
      content="https://tomome-website.vercel.app/preview.png"
    />

    <!-- Twitter / X -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="Tomome — Pregnancy Care & Support"
    />

    <meta
      name="twitter:description"
      content="Pregnancy education, prenatal wellness, nutrition guidance, childbirth preparation, expert guidance, and ongoing support for expecting mothers."
    />

    <meta
      name="twitter:image"
      content="https://tomome-website.vercel.app/preview.png"
    />
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
